# Render Blueprint: New > Blueprint > pick this repo. Generated by make_render.py from config.py.
services:
  - type: worker                 # background worker: no port, never sleeps
    name: kronos-limit-bot
    runtime: python
    region: frankfurt
    plan: standard               # 2 GB RAM / 1 CPU; use pro for a big universe or Kronos-base
    buildCommand: bash build.sh
    startCommand: python bot.py
    disk:                        # keeps state.json (open positions!) across deploys/restarts
      name: bot-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: HF_HOME
        value: /opt/render/project/src/.hf_cache
      - key: MODE
        value: "paper"
      - key: CONFIRM_LIVE            # must be "yes" for MODE=live
        sync: false
      - key: EXCHANGE
        value: "kucoinfutures"
      - key: API_KEY            # KuCoin API key (Futures trade permission, NO withdraw)
        sync: false
      - key: API_SECRET            # KuCoin API secret
        sync: false
      - key: API_PASSWORD            # KuCoin API passphrase
        sync: false
      - key: KUCOIN_UTA
        value: "auto"
      - key: TIMEFRAME
        value: "1h"
      - key: SYMBOLS
        value: ""
      - key: UNIVERSE_SIZE
        value: "15"
      - key: MIN_VOLUME_USDT
        value: "20000000.0"
      - key: MAX_SPREAD_PCT
        value: "0.0008"
      - key: BLACKLIST
        value: ""
      - key: ALWAYS_INCLUDE
        value: ""
      - key: UNIVERSE_REFRESH_BARS
        value: "4"
      - key: RANK_BY
        value: "sharpe"
      - key: MAX_POSITIONS
        value: "3"
      - key: MAX_SAME_SIDE
        value: "0"
      - key: MAX_TOTAL_NOTIONAL_USDT
        value: "0.0"
      - key: FORECAST_BATCH
        value: "32"
      - key: LEVERAGE
        value: "3"
      - key: MARGIN_MODE
        value: "isolated"
      - key: SET_MARGIN_MODE_ON_START
        value: "true"
      - key: TRIGGER_PRICE_TYPE
        value: "mark"
      - key: ALLOW_LONG
        value: "true"
      - key: ALLOW_SHORT
        value: "true"
      - key: MODEL_NAME
        value: "NeoQuasar/Kronos-small"
      - key: TOKENIZER_NAME
        value: "NeoQuasar/Kronos-Tokenizer-base"
      - key: MAX_CONTEXT
        value: "512"
      - key: LOOKBACK
        value: "400"
      - key: HORIZON_BARS
        value: "1"
      - key: SAMPLE_PATHS
        value: "8"
      - key: TEMPERATURE
        value: "1.0"
      - key: TOP_P
        value: "0.9"
      - key: TOP_K
        value: "0"
      - key: SEED
        value: "-1"
      - key: TORCH_THREADS
        value: "0"
      - key: MIN_EDGE_LONG
        value: "0.003"
      - key: MIN_EDGE_SHORT
        value: "0.003"
      - key: MIN_AGREEMENT
        value: "0.7"
      - key: MAX_DISPERSION
        value: "0.0"
      - key: ENTRY_PULLBACK
        value: "0.35"
      - key: TP_CAPTURE
        value: "0.8"
      - key: MAKER_FEE
        value: "0.0002"
      - key: TAKER_FEE
        value: "0.0006"
      - key: MIN_NET_EDGE
        value: "0.001"
      - key: EXIT_ON_FLIP
        value: "true"
      - key: REVERSE_ON_FLIP
        value: "false"
      - key: ENTRY_MODE
        value: "limit_then_market"
      - key: ENTRY_CHASE_SECONDS
        value: "120"
      - key: STOP_ORDER_TYPE
        value: "market"
      - key: EXIT_CHASE_SECONDS
        value: "120"
      - key: RSI_FILTER
        value: "true"
      - key: RSI_PERIOD
        value: "14"
      - key: RSI_LONG_MAX
        value: "75.0"
      - key: RSI_SHORT_MIN
        value: "25.0"
      - key: EMA_FILTER
        value: "true"
      - key: EMA_PERIOD
        value: "50"
      - key: BB_FILTER
        value: "false"
      - key: BB_PERIOD
        value: "20"
      - key: BB_STD
        value: "2.0"
      - key: OI_FILTER
        value: "true"
      - key: OI_EXCHANGE
        value: "binanceusdm"
      - key: OI_PERIOD
        value: "5m"
      - key: OI_LOOKBACK_BARS
        value: "4"
      - key: OI_MIN_CHANGE
        value: "0.01"
      - key: OI_SPIKE_MODE
        value: "avoid"
      - key: OI_SPIKE_Z
        value: "3.0"
      - key: OI_SPIKE_MIN_PCT
        value: "0.005"
      - key: OI_SPIKE_WINDOW
        value: "100"
      - key: OI_SPIKE_BARS
        value: "2"
      - key: OI_SPIKE_ALERT
        value: "true"
      - key: OI_REQUIRED
        value: "false"
      - key: SIZE_MODE
        value: "fixed"
      - key: NOTIONAL_USDT
        value: "300.0"
      - key: EQUITY_PCT
        value: "0.1"
      - key: MAX_CONTRACTS
        value: "0"
      - key: MAX_NOTIONAL_USDT
        value: "0.0"
      - key: STOP_PCT
        value: "0.015"
      - key: EXCHANGE_STOP
        value: "true"
      - key: HARD_STOP_PCT
        value: "0.03"
      - key: STOP_LIMIT_SLIPPAGE
        value: "0.005"
      - key: MAX_HOLD_BARS
        value: "3"
      - key: ENTRY_TTL_BARS
        value: "1"
      - key: COOLDOWN_BARS
        value: "1"
      - key: MAX_TRADES_PER_DAY
        value: "0"
      - key: MAX_DAILY_LOSS_USDT
        value: "0.0"
      - key: MAX_CONSECUTIVE_LOSSES
        value: "0"
      - key: MIN_EQUITY_USDT
        value: "0.0"
      - key: PAUSE_ENTRIES
        value: "false"
      - key: TRADE_HOURS_UTC
        value: ""
      - key: TRADE_WEEKDAYS
        value: ""
      - key: POLL_SECONDS
        value: "10"
      - key: CANDLE_CLOSE_DELAY
        value: "5"
      - key: REPEG_TICKS
        value: "1"
      - key: STATE_FILE
        value: "/var/data/state.json"
      - key: LOG_LEVEL
        value: "INFO"
      - key: WEBHOOK_URL            # Discord/Slack/Telegram-relay webhook for trade alerts
        sync: false
      - key: HEARTBEAT_BARS
        value: "4"
      - key: PAPER_START_USDT
        value: "1000.0"
